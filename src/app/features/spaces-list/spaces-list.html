<div class="explorer">
  <div class="content">
    <header class="hero">
      <p class="eyebrow">SPACE EXPLORER</p>
      <h1>Explore space.</h1>
      <p class="intro">Discover launches, spacecraft and the people behind space exploration.</p>
    </header>

    <section class="cards" aria-label="Space exploration categories">
      @for (item of list; track $index) {
        <app-space
          text="{{ item.title }}"
          icon="{{ item.icon }}"
          description="{{ item.description }}"
          link="{{ item.link }}"
        />
      }
    </section>
  </div>
</div>
